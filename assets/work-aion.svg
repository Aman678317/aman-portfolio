<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Abstract agent task-flow diagram">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1b1740"/>
      <stop offset=".55" stop-color="#0d0b24"/>
      <stop offset="1" stop-color="#070614"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6e56d8" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a789d4" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#cbb8ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#a789d4" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbb8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6e56d8" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="620" rx="420" ry="130" fill="#6e56d8" opacity=".22" filter="url(#soft)"/>
  <g stroke="#a789d4" stroke-opacity=".09" stroke-width="1">
    <path d="M-100 780 L700 260 M100 900 L900 380 M300 980 L1100 460 M-200 600 L450 320"/>
  </g>
  <g transform="translate(600 470)">
    <g filter="url(#glow)" fill="none" stroke="url(#line)" stroke-width="2">
      <path d="M-340 120 C-230 40 -180 -40 -90 -60"/>
      <path d="M340 120 C230 40 180 -40 90 -60"/>
      <path d="M-300 -150 C-140 -220 140 -220 300 -150"/>
    </g>
    <g transform="translate(0 -60)">
      <rect x="-160" y="-105" width="320" height="210" rx="22" fill="url(#glass)" stroke="#cbb8ff" stroke-opacity=".35"/>
      <rect x="-160" y="-105" width="320" height="4" rx="2" fill="url(#edge)"/>
      <g fill="#cbb8ff" opacity=".55">
        <circle cx="-112" cy="-52" r="6"/><circle cx="-112" cy="-12" r="6"/><circle cx="-112" cy="28" r="6"/>
      </g>
      <g fill="#cbb8ff" opacity=".22">
        <rect x="-82" y="-58" width="150" height="12" rx="6"/>
        <rect x="-82" y="-18" width="196" height="12" rx="6"/>
        <rect x="-82" y="22" width="118" height="12" rx="6"/>
      </g>
      <rect x="52" y="-62" width="62" height="20" rx="10" fill="#a789d4" opacity=".5"/>
    </g>
    <g transform="translate(-330 150)">
      <rect x="-84" y="-56" width="168" height="112" rx="16" fill="url(#glass)" stroke="#cbb8ff" stroke-opacity=".28"/>
      <rect x="-84" y="-56" width="168" height="3" rx="2" fill="url(#edge)"/>
      <g fill="#cbb8ff" opacity=".3">
        <rect x="-52" y="-18" width="70" height="9" rx="4"/>
        <rect x="-52" y="2" width="104" height="9" rx="4"/>
      </g>
    </g>
    <g transform="translate(330 150)">
      <rect x="-84" y="-56" width="168" height="112" rx="16" fill="url(#glass)" stroke="#cbb8ff" stroke-opacity=".28"/>
      <rect x="-84" y="-56" width="168" height="3" rx="2" fill="url(#edge)"/>
      <g fill="#cbb8ff" opacity=".3">
        <rect x="-52" y="-18" width="96" height="9" rx="4"/>
        <rect x="-52" y="2" width="62" height="9" rx="4"/>
      </g>
    </g>
    <g fill="#cbb8ff" filter="url(#glow)">
      <circle cx="-90" cy="-60" r="5"/>
      <circle cx="90" cy="-60" r="5"/>
      <circle cx="-300" cy="-150" r="4"/>
      <circle cx="300" cy="-150" r="4"/>
    </g>
  </g>
  <rect width="1200" height="900" fill="#05040f" opacity=".12"/>
</svg>
