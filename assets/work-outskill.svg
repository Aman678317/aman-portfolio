<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Abstract prompt and automation nodes illustration">
  <defs>
    <radialGradient id="bg4" cx="48%" cy="42%" r="80%">
      <stop offset="0" stop-color="#1c1747"/>
      <stop offset=".6" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#06050f"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#5a44b8" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="stroke4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb8ff" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#e5dcff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#a789d4" stop-opacity=".1"/>
    </linearGradient>
    <filter id="glow4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg4)"/>
  <ellipse cx="600" cy="470" rx="380" ry="230" fill="#7a5fe0" opacity=".16" filter="url(#soft4)"/>
  <g fill="none" stroke="url(#stroke4)" stroke-width="2" filter="url(#glow4)">
    <path d="M300 320 C 420 320 420 220 540 220 C 660 220 660 320 780 320"/>
    <path d="M300 320 C 420 320 420 450 540 450"/>
    <path d="M780 320 C 860 320 860 450 940 450"/>
  </g>
  <g transform="translate(320 320)">
    <rect x="-120" y="-52" width="240" height="104" rx="54" fill="url(#chip)" stroke="#cbb8ff" stroke-opacity=".3"/>
    <rect x="-86" y="-18" width="172" height="12" rx="6" fill="#cbb8ff" opacity=".38"/>
    <rect x="-86" y="8" width="120" height="10" rx="5" fill="#cbb8ff" opacity=".2"/>
  </g>
  <g transform="translate(540 210)">
    <rect x="-96" y="-40" width="192" height="80" rx="18" fill="url(#chip)" stroke="#cbb8ff" stroke-opacity=".28"/>
    <g fill="#cbb8ff" opacity=".3">
      <rect x="-62" y="-14" width="88" height="10" rx="5"/>
      <rect x="-62" y="8" width="124" height="10" rx="5"/>
    </g>
  </g>
  <g transform="translate(540 450)">
    <rect x="-96" y="-40" width="192" height="80" rx="18" fill="url(#chip)" stroke="#cbb8ff" stroke-opacity=".28"/>
    <g fill="#cbb8ff" opacity=".28">
      <rect x="-62" y="-14" width="120" height="10" rx="5"/>
      <rect x="-62" y="8" width="70" height="10" rx="5"/>
    </g>
  </g>
  <g transform="translate(880 360)">
    <circle r="60" fill="url(#chip)" stroke="#cbb8ff" stroke-opacity=".35"/>
    <circle r="26" fill="#a789d4" opacity=".35"/>
    <circle r="8" fill="#e5dcff" filter="url(#glow4)"/>
  </g>
  <g fill="#cbb8ff" filter="url(#glow4)">
    <circle cx="300" cy="320" r="5"/>
    <circle cx="780" cy="320" r="5"/>
    <circle cx="540" cy="210" r="4"/>
    <circle cx="540" cy="450" r="4"/>
  </g>
  <g fill="#cbb8ff" opacity=".45">
    <circle cx="150" cy="200" r="2.5"/><circle cx="1050" cy="220" r="3"/>
    <circle cx="990" cy="720" r="2.5"/><circle cx="200" cy="680" r="3"/>
  </g>
  <rect width="1200" height="900" fill="#05040f" opacity=".14"/>
</svg>
