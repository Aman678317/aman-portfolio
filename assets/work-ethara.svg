        <rect x="-196" y="-124" width="330" height="10" rx="5"/>
        <rect x="-196" y="-102" width="286" height="10" rx="5"/>
        <rect x="-196" y="-80" width="352" height="10" rx="5"/>
        <rect x="-196" y="-34" width="90" height="10" rx="5"/>
        <rect x="-196" y="-12" width="300" height="10" rx="5"/>
        <rect x="-196" y="10" width="240" height="10" rx="5"/>
        <rect x="-196" y="32" width="316" height="10" rx="5"/>
      </g>
    </g>
    <g transform="translate(720 620)">
