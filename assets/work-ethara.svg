<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Abstract data evaluation illustration">
  <defs>
    <radialGradient id="bg2" cx="58%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1d1846"/>
      <stop offset=".6" stop-color="#0b0a20"/>
      <stop offset="1" stop-color="#06050f"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#5a44b8" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e56d8" stop-opacity="0"/>
      <stop offset=".25" stop-color="#cbb8ff" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#a789d4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6e56d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg2)"/>
  <ellipse cx="640" cy="470" rx="360" ry="220" fill="#7a5fe0" opacity=".18" filter="url(#soft2)"/>
