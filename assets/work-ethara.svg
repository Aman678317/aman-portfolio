        <rect x="-196" y="82" width="250" height="10" rx="5"/>
        <rect x="-196" y="104" width="330" height="10" rx="5"/>
        <rect x="-196" y="126" width="210" height="10" rx="5"/>
        <rect x="-196" y="148" width="276" height="10" rx="5"/>
      </g>
