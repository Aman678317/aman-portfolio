<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Abstract layered service architecture illustration">
  <defs>
    <radialGradient id="bg3" cx="52%" cy="45%" r="80%">
      <stop offset="0" stop-color="#191543"/>
      <stop offset=".58" stop-color="#0b0a1e"/>
      <stop offset="1" stop-color="#06050e"/>
    </radialGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98fe8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#45318f" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb8ff" stop-opacity=".1"/>
      <stop offset=".45" stop-color="#e0d6ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#a789d4" stop-opacity=".1"/>
    </linearGradient>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg3)"/>
  <ellipse cx="600" cy="560" rx="390" ry="180" fill="#6e56d8" opacity=".2" filter="url(#soft3)"/>
  <g transform="translate(600 470)">
    <g transform="translate(0 150) skewX(-18)">
      <rect x="-340" y="-70" width="680" height="140" rx="18" fill="url(#slab)" stroke="#cbb8ff" stroke-opacity=".25"/>
      <rect x="-340" y="-70" width="680" height="5" rx="2.5" fill="url(#rim)"/>
    </g>
    <g transform="translate(0 20) skewX(-18)">
      <rect x="-320" y="-70" width="640" height="140" rx="18" fill="url(#slab)" stroke="#cbb8ff" stroke-opacity=".3"/>
      <rect x="-320" y="-70" width="640" height="5" rx="2.5" fill="url(#rim)"/>
      <g fill="#cbb8ff" opacity=".22">
        <rect x="-250" y="-24" width="150" height="10" rx="5"/>
        <rect x="-250" y="-2" width="90" height="10" rx="5"/>
      </g>
    </g>
    <g transform="translate(0 -110) skewX(-18)">
      <rect x="-300" y="-70" width="600" height="140" rx="18" fill="url(#slab)" stroke="#cbb8ff" stroke-opacity=".35"/>
      <rect x="-300" y="-70" width="600" height="5" rx="2.5" fill="url(#rim)"/>
      <g fill="#cbb8ff" opacity=".26">
        <rect x="-240" y="-22" width="180" height="12" rx="6"/>
        <rect x="-240" y="4" width="120" height="10" rx="5"/>
        <rect x="60" y="-22" width="80" height="34" rx="17" fill="#a789d4" opacity=".55"/>
      </g>
    </g>
    <g stroke="url(#rim)" stroke-width="2" fill="none" filter="url(#glow3)">
      <path d="M-300 -40 C-190 -40 -140 90 -40 90"/>
      <path d="M300 -40 C190 -40 140 90 40 90"/>
      <path d="M-280 -250 C-120 -320 120 -320 280 -250" opacity=".55"/>
    </g>
    <g fill="#d9ccff" filter="url(#glow3)">
      <circle cx="-300" cy="-40" r="4.5"/>
      <circle cx="300" cy="-40" r="4.5"/>
      <circle cx="-40" cy="90" r="4"/>
      <circle cx="40" cy="90" r="4"/>
    </g>
  </g>
  <rect width="1200" height="900" fill="#05040f" opacity=".14"/>
</svg>
